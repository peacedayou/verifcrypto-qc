name: Données et démo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:   # essai manuel de collecte depuis GitHub (le site de l'AMF peut la refuser)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collecte complète des mises en garde de l'AMF
        id: maj
        if: github.event_name != 'push'
        continue-on-error: true   # refus du site (403) : on garde les données déjà publiées
        run: python -m verifcrypto maj
      - name: Collecte refusée, données conservées
        if: steps.maj.outcome == 'failure'
        run: echo "::warning::La collecte a été refusée par le site de l'AMF ; la démo garde les données existantes. Lancez « python -m verifcrypto maj » depuis votre ordinateur."
      - name: Tests sur les nouvelles données
        if: steps.maj.outcome == 'success'
        run: python -m unittest discover -s tests
      - name: Enregistrer les données dans le dépôt
        if: steps.maj.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amf_mises_en_garde.json
          git diff --cached --quiet || git commit -m "Données : mises en garde de l'AMF du $(date -u +%F)"
          git push
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp web/index.html web/verif.js _site/
          cp data/amf_mises_en_garde.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
